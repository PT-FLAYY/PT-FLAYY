
name: Generate Contribution Garden

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Contribution Snakes
        uses: Platane/snk@v3
        with:
          github_user_name: PT-FLAYY
          outputs: |
            dist/snake-green.svg?palette=github-dark&color_snake=%23a6e3a1
            dist/snake-pink.svg?palette=github-dark&color_snake=%23f38ba8
            dist/snake-cyan.svg?palette=github-dark&color_snake=%2389dceb

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
